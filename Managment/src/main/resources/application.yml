spring:
  application:
    name: Managment
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://db:5432/EMS
#    url: jdbc:postgresql://localhost:5432/EMS
    username: postgres
    password: 1111
  jpa:
    hibernate:
      ddl-auto: none
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    baselineOnMigrate: true
    baselineVersion: 1
    locations:
      - classpath:db/migration
